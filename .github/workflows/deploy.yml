name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The build resolves the download links against the latest release's assets,
  # so publishing a release has to rebuild the site or the links keep pointing
  # at the previous version. Releases are cut in this repo, so this is a plain
  # `release` trigger — no repository_dispatch or cross-repo token needed.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always build the current main. On a `release` event the default
      # checkout is the tagged commit, which would deploy the site as it looked
      # at the tag rather than as it is now — the release is a trigger to
      # re-resolve the download links, not the content to publish.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build resolves the download links against the latest release's
      # assets (src/lib/release.ts). Unauthenticated GitHub allows 60 requests
      # per hour per IP and runners share IPs, so pass the token the job
      # already has — `contents: read` above is enough to read releases.
      # Without it the build still succeeds, but falls back to the static URLs
      # in src/downloads.ts and loses the direct APK link.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
